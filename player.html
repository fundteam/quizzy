<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quizzy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mali:wght@600&family=Prompt:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="quizzy.css" />
  </head>
  <body class="p">
    <div id="app"></div>
    <script src="common.js"></script>
    <script>
      let S = { room: sessionStorage.room, pid: sessionStorage.pid };
      let st = {},
        key = "",
        t0 = 0,
        sent = -1,
        last = -1;
      let room0 = "",
        loopId = 0,
        drawPlayers = [];
      let machineRAF = 0,
        machineBalls = [],
        machineCanvas = null,
        machineCtx = null;
      let machineLast = 0,
        machineRunning = false,
        machineMixing = false,
        seenDrawId = "";

      const show = (h) => ($("app").innerHTML = h);

      function join() {
        show(`${BRAND}<div class="card">
        <small>ใส่รหัสห้อง</small>
        <input id="c" class="ci" placeholder="0000" inputmode="numeric" maxlength="6">
        <button class="full" onclick="chk()">ต่อไป</button><p id="e"></p>
      </div>`);
        $("c").onkeydown = (e) => {
          if (e.key === "Enter") chk();
        };
        $("c").focus();
      }

      async function chk() {
        const code = $("c").value.trim();
        if (!code) return ($("e").textContent = "กรอกรหัสห้องก่อน");
        try {
          const r = await api(
            "rooms?select=code&code=eq." + encodeURIComponent(code),
          );
          if (!r.length)
            return ($("e").textContent = "ไม่พบห้องนี้ ลองเช็กรหัสอีกครั้ง");
          room0 = code;
          ask();
        } catch (x) {
          $("e").textContent = "ตรวจรหัสไม่ได้ ลองอีกครั้ง";
        }
      }

      function ask() {
        show(`${BRAND}<div class="card">
        <small>ห้อง ${esc(room0)}</small>
        <input id="n" placeholder="ชื่อของคุณ" maxlength="20">
        <button class="full" onclick="go()">เข้าห้อง</button>
        <button class="link" onclick="join()">เปลี่ยนรหัสห้อง</button><p id="e"></p>
      </div>`);
        $("n").onkeydown = (e) => {
          if (e.key === "Enter") go();
        };
        $("n").focus();
      }

      async function go() {
        const name = $("n").value.trim();
        if (!name) return ($("e").textContent = "ใส่ชื่อของคุณก่อน");
        try {
          const p = await api("players", {
            method: "POST",
            body: { room: room0, name },
            prefer: "return=representation",
          });
          S = { room: room0, pid: p[0].id };
          sessionStorage.room = room0;
          sessionStorage.pid = p[0].id;
          loop();
        } catch (x) {
          $("e").textContent = "เข้าห้องไม่ได้ ลองอีกครั้ง";
        }
      }

      async function loop() {
        const myLoop = ++loopId;
        show(MASCOT + "<h2>กำลังเข้าห้อง…</h2>");
        while (myLoop === loopId && S.room && S.pid) {
          try {
            const r = await api(
              "rooms?select=state&code=eq." + encodeURIComponent(S.room),
            );
            if (myLoop !== loopId) break;
            st = r[0]?.state || {};
            if (st.mode === "draw") {
              try {
                drawPlayers = await api(
                  "players?select=id,name&room=eq." +
                    encodeURIComponent(S.room),
                );
              } catch (e) {}
            }
            await render();
          } catch (x) {
            key = "";
          }
          await sleep(1800);
        }
      }

      async function render() {
        if (st.mode === "draw" && st.phase === "lobby") {
          if (!$("drawMachine")) renderDrawMachine();
          updateDrawCount();
          syncMachineBalls(drawPlayers);
          if (st.draw?.id && st.draw.id !== seenDrawId) {
            seenDrawId = st.draw.id;
            await playDrawAnimation(st.draw);
          }
          return;
        }

        const k = [st.phase, st.qi, (st.winners || []).length].join();
        if (k === key) return;
        key = k;

        if (st.phase === "q") {
          stopMachine();
          t0 = Date.now();
          show(`<div class="bar"><i style="animation-duration:${st.q.limit}s"></i></div>
          <div class="card"><h2>${esc(st.q.text)}</h2></div>
          <div id="opts">${st.q.opts.map((o, i) => `<button class="o${i}" data-s="${"▲◆●■"[i]}" onclick="pick(${i})">${esc(o)}</button>`).join("")}</div>`);
        } else if (st.phase === "result") {
          const p = await api("players?select=score&id=eq." + S.pid);
          const answered = sent === st.qi,
            ok = answered && last === st.ans;
          if (ok) confetti(14);
          show(`${mascot(ok ? "happy" : answered ? "sad" : "idle", "lg")}
          <h1>${ok ? "ถูกต้อง!" : answered ? "ยังไม่ถูก" : "ไม่ได้ตอบ"}</h1>
          <div class="card"><small>คะแนนรวม</small><div class="big">${p[0]?.score ?? 0}</div></div>`);
        } else if (st.phase === "end") {
          const [t, me] = await Promise.all([
            api(
              `players?select=id,name,score&order=score.desc&limit=3&room=eq.${S.room}`,
            ),
            api("players?select=score&id=eq." + S.pid),
          ]);
          const score = me[0]?.score ?? 0;
          const higher = await api(
            `players?select=id&room=eq.${S.room}&score=gt.${score}`,
          );
          const rank = higher.length + 1;
          confetti(rank === 1 ? 70 : 20);
          show(`<div class="card tc">${mascot("happy", "lg")}<small>ผู้ชนะอันดับ 1</small>
          <h1>👑 ${esc(t[0]?.name ?? "-")}</h1><div class="big">${t[0]?.score ?? 0}</div></div>
          <div class="card"><b>🏆 3 อันดับแรก</b>${rankRows(t)}</div>
          <div class="card tc"><small>${rank === 1 ? "คุณคือที่ 1!" : "อันดับของคุณ"}</small>
          <div class="big">${rank}</div><small>${score} คะแนน</small></div>
          <button class="full" onclick="askHome()">กลับไปหน้าแรก</button>`);
        } else if ((st.winners || []).includes(S.pid)) {
          confetti(40);
          show(mascot("happy", "lg") + "<h1>🎁 คุณถูกสุ่มได้รางวัล!</h1>");
        } else {
          show(
            MASCOT +
              "<h2>เข้าห้องแล้ว</h2><p>รอ Host เริ่มเกม หรือรอลุ้นรางวัล</p>",
          );
        }
      }

      function renderDrawMachine() {
        stopMachine();
        show(`<main class="draw-app" id="drawMachine">
        <header class="draw-header">
          <div class="draw-brand">Quizzy</div>
          <div class="draw-kicker">LUCKY DRAW</div>
          <h1>ลุ้นรางวัลไปด้วยกัน</h1>
          <p><span id="drawCount">0</span> ลูกบอลในตู้</p>
        </header>
        <section class="machine-stage" id="machineStage">
          <div class="machine-top-cap"></div>
          <div class="machine-globe">
            <div class="glass-highlight"></div>
            <canvas id="ballCanvas"></canvas>
            <div class="glass-reflection"></div>
          </div>
          <div class="machine-neck"></div>
          <div class="machine-base">
            <div class="base-rim"></div>
            <div class="base-label">QUIZZY <span>★</span> DRAW</div>
            <div class="base-light"></div>
          </div>
          <svg class="draw-chute" viewBox="0 0 260 220" aria-hidden="true">
            <path class="chute-shadow" d="M8 12 C90 18 88 78 150 90 S225 125 220 205"/>
            <path class="chute-rail" d="M8 12 C90 18 88 78 150 90 S225 125 220 205"/>
            <path class="chute-inner" d="M8 12 C90 18 88 78 150 90 S225 125 220 205"/>
          </svg>
          <div class="selected-ball" id="selectedBall"><span id="selectedBallName"></span></div>
          <div class="capsule-holder" id="capsuleHolder">
            <div class="capsule" id="winnerCapsule">
              <div class="capsule-half capsule-top"></div>
              <div class="capsule-name" id="capsuleName">?</div>
              <div class="capsule-half capsule-bottom"></div>
            </div>
            <div class="capsule-caption" id="capsuleCaption">รอผลการจับฉลาก</div>
          </div>
          <div class="machine-status" id="machineStatus">รอ Host เริ่มจับฉลาก…</div>
        </section>
        <footer class="draw-footer"><span class="live-dot"></span> เชื่อมต่อกับห้องจับฉลาก</footer>
      </main>`);
        machineCanvas = $("ballCanvas");
        machineCtx = machineCanvas.getContext("2d");
        resizeMachineCanvas();
        window.addEventListener("resize", resizeMachineCanvas);
        machineRunning = true;
        machineLast = 0;
        machineRAF = requestAnimationFrame(machineFrame);
        syncMachineBalls(drawPlayers);
      }

      function updateDrawCount() {
        const el = $("drawCount");
        if (el) el.textContent = drawPlayers.length;
      }

      function syncMachineBalls(players) {
        if (!machineCanvas || !players) return;
        const names = players
          .filter((p) => !(st.winners || []).includes(p.id))
          .map((p) => ({ id: p.id, name: p.name }));
        const existing = new Map(machineBalls.map((b) => [b.id, b]));
        machineBalls = names.map(
          (p, i) => existing.get(p.id) || makeBall(p, i),
        );
        updateDrawCount();
      }

      function makeBall(p, i) {
        const colors = [
          "#f4bd24",
          "#f6d66c",
          "#e7a916",
          "#d9e7e5",
          "#f0a83c",
          "#ffe18a",
        ];
        return {
          id: p.id,
          name: p.name,
          x: 0,
          y: 0,
          r: 12 + Math.random() * 5,
          color: colors[i % colors.length],
          phase: Math.random() * 6.28,
        };
      }

      function resizeMachineCanvas() {
        if (!machineCanvas) return;
        const rect = machineCanvas.getBoundingClientRect(),
          dpr = Math.min(devicePixelRatio || 1, 2);
        machineCanvas.width = Math.max(1, Math.floor(rect.width * dpr));
        machineCanvas.height = Math.max(1, Math.floor(rect.height * dpr));
        machineCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // จัดลูกบอลเป็นกองซ้อนกันด้านล่างของโถ ไม่ให้เคลื่อนที่ตลอดเวลา
      function machineFrame(now) {
        if (!machineRunning || !machineCanvas || !machineCanvas.isConnected)
          return;
        const ctx = machineCtx,
          w = machineCanvas.clientWidth,
          h = machineCanvas.clientHeight;
        ctx.clearRect(0, 0, w, h);
        const n = machineBalls.length,
          baseR = Math.max(10, Math.min(17, w * 0.043));
        const cols = Math.max(3, Math.floor(w / (baseR * 2.35)));
        const rows = Math.ceil(n / cols),
          pile = [];
        let idx = 0;
        for (let row = 0; row < rows; row++) {
          const count = Math.min(cols, n - idx),
            y = h * 0.84 - row * baseR * 1.82;
          const span = (count - 1) * baseR * 2.05;
          for (let col = 0; col < count; col++) {
            const b = machineBalls[idx++];
            const x = w / 2 - span / 2 + col * baseR * 2.05;
            const wobble = machineMixing
              ? Math.sin(now / 520 + b.phase) * baseR * 0.48
              : 0;
            const lift = machineMixing
              ? Math.cos(now / 610 + b.phase) * baseR * 0.36
              : 0;
            pile.push({ b, x: x + wobble, y: y + lift });
          }
        }
        // วาดจากด้านหลังมาด้านหน้า ให้เห็นลักษณะลูกบอลกองซ้อนกัน
        pile.sort((a, b) => a.y - b.y);
        for (const item of pile) drawBall(ctx, item.x, item.y, item.b, now);
        machineRAF = requestAnimationFrame(machineFrame);
      }

      function drawBall(ctx, x, y, b, now) {
        const r = b.r,
          g = ctx.createRadialGradient(
            x - r * 0.35,
            y - r * 0.4,
            r * 0.08,
            x,
            y,
            r * 1.2,
          );
        g.addColorStop(0, "#fff8d7");
        g.addColorStop(0.22, b.color);
        g.addColorStop(1, "#87570a");
        ctx.save();
        ctx.shadowColor = "#0009";
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 4;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.restore();
        ctx.beginPath();
        ctx.arc(x - r * 0.3, y - r * 0.36, r * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = "#fff9";
        ctx.fill();
        ctx.fillStyle = "#241a08";
        ctx.font = `600 ${Math.max(8, Math.min(11, r * 0.55))}px Prompt, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        let label = b.name || "";
        while (ctx.measureText(label).width > r * 1.55 && label.length > 3)
          label = label.slice(0, -2) + "…";
        ctx.fillText(label, x, y + 1);
      }

      function stopMachine() {
        machineRunning = false;
        machineMixing = false;
        if (machineRAF) cancelAnimationFrame(machineRAF);
        machineRAF = 0;
        machineCanvas = null;
        machineCtx = null;
      }

      async function playDrawAnimation(draw) {
        const stage = $("machineStage");
        if (!stage) return;
        const status = $("machineStatus"),
          selected = $("selectedBall"),
          name = $("selectedBallName");

        // เช็กว่าผู้ชนะคือผู้เล่นเครื่องนี้หรือไม่
        const isMe = draw.id === S.pid;
        const winner = isMe ? `${draw.name} (คุณ!)` : draw.name || "ผู้โชคดี";

        status.textContent = "ลูกบอลกำลังถูกคนช้า ๆ ในโถ…";
        stage.classList.remove("is-drawing", "winner-revealed");
        selected.classList.remove("traveling", "revealed");
        selected.style.display = "none";
        machineMixing = true;
        machineCanvas?.classList.add("mixing");
        stage.classList.add("is-drawing");
        await sleep(2600);
        machineMixing = false;
        machineCanvas?.classList.remove("mixing");
        status.textContent = "ลูกบอลผู้โชคดีกำลังออกจากโถ…";
        name.textContent = winner;
        selected.style.display = "grid";
        selected.classList.add("traveling");
        await sleep(1900);
        selected.classList.remove("traveling");
        selected.classList.add("revealed");
        stage.classList.add("winner-revealed");

        // ปรับเปลี่ยนข้อความสถานะตอนจับเสร็จสิ้น
        if (isMe) {
          status.textContent = "🎉 ยินดีด้วย! คุณคือผู้โชคดีที่ได้รับรางวัล!";
          confetti(80); // จุดพลุฉลองเพิ่มขึ้นสำหรับคนชนะ
        } else {
          status.textContent = `🎉 ขอแสดงความยินดีกับคุณ ${esc(draw.name)}!`;
          confetti(42);
        }
      }

      function askHome() {
        if (document.getElementById("homeConfirm")) return;
        document.body.insertAdjacentHTML(
          "beforeend",
          `<div id="homeConfirm" class="home-overlay">
        <div class="card tc home-dialog"><h2>🏠 กลับไปหน้าแรก?</h2>
        <p>คุณต้องการออกจากเกมและกลับไปหน้าแรกใช่หรือไม่?</p>
        <button class="full" onclick="backHome()">ยืนยันกลับหน้าแรก</button>
        <button class="sec full" onclick="cancelHome()">ยกเลิก</button></div></div>`,
        );
      }
      function cancelHome() {
        document.getElementById("homeConfirm")?.remove();
      }
      function backHome() {
        cancelHome();
        loopId++;
        stopMachine();
        window.removeEventListener("resize", resizeMachineCanvas);
        sessionStorage.removeItem("room");
        sessionStorage.removeItem("pid");
        S = { room: "", pid: "" };
        room0 = "";
        st = {};
        key = "";
        t0 = 0;
        sent = -1;
        last = -1;
        seenDrawId = "";
        join();
      }

      function pick(i) {
        if (sent === st.qi) return;
        sent = st.qi;
        last = i;
        const t = Date.now() - t0;
        show(MASCOT + "<h2>ส่งคำตอบแล้ว</h2><p>รอเฉลย…</p>");
        api("answers", {
          method: "POST",
          body: { room: S.room, qi: st.qi, pid: S.pid, choice: i, t },
          prefer: "resolution=ignore-duplicates,return=minimal",
        }).catch(() => {
          sent = -1;
          key = "";
        });
      }

      S.room && S.pid ? loop() : join();
    </script>
  </body>
</html>
